name: Compilar LiveinFé (Android APK)

on:
  push:
    branches: [ "main", "master" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch: # Permite disparar a compilação manualmente com 1 clique no GitHub Actions

jobs:
  build-android:
    name: Compilar APK Android
    runs-on: ubuntu-latest
    steps:
      - name: Baixar código do repositório
        uses: actions/checkout@v4

      - name: Configurar Java 21 (Temurin)
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Conceder permissão de execução ao Gradle Wrapper
        run: chmod +x android/gradlew

      - name: Compilar APK (assembleDebug)
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon --stacktrace 2>&1 | tee gradle-build.log

      - name: Exibir log de erro do Gradle se falhar
        if: failure()
        run: |
          echo "=== GRADLE FAILURE LOG ==="
          tail -n 150 android/gradle-build.log

      - name: Salvar Log de Erro para Diagnóstico
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-failure-log
          path: android/gradle-build.log

      - name: Renomear APK para nome oficial LiveinFé
        run: |
          echo "Buscando APKs gerados:"
          find android/app/build -name "*.apk"
          APK_FILE=$(find android/app/build -name "*.apk" | head -n 1)
          echo "APK encontrado: $APK_FILE"
          cp "$APK_FILE" liveinfe-v1.0.1.apk
          ls -lh liveinfe-v1.0.1.apk

      - name: Disponibilizar APK para Download (Artefato)
        uses: actions/upload-artifact@v4
        with:
          name: LiveinFe-Android-APK
          path: liveinfe-v1.0.1.apk
          retention-days: 30

  release:
    name: Publicar Release Oficial no GitHub
    needs: build-android
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Baixar APK compilado
        uses: actions/download-artifact@v4
        with:
          name: LiveinFe-Android-APK
          path: release-assets/

      - name: Criar Release e Anexar APK
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/liveinfe-v1.0.1.apk
          name: "LiveinFé v1.0.1"
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
