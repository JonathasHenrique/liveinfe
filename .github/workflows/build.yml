name: Compilar LiveinFé (Android APK)

on:
  push:
    branches: [ "main", "master" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch: # Permite disparar a compilação manualmente com 1 clique no GitHub Actions

jobs:
  build-android:
    name: Compilar APK Android
    runs-on: ubuntu-latest
    steps:
      - name: Baixar código do repositório
        uses: actions/checkout@v4

      - name: Configurar Java 21 (Temurin)
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Conceder permissão de execução ao Gradle Wrapper
        run: chmod +x android/gradlew

      - name: Compilar APK (assembleDebug)
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Renomear APK para nome oficial LiveinFé
        run: |
          TAG_NAME="${{ github.ref_name }}"
          if [ -z "$TAG_NAME" ]; then TAG_NAME="v1.0.2"; fi
          cp android/app/build/outputs/apk/debug/app-debug.apk "liveinfe-${TAG_NAME}.apk"
          cp android/app/build/outputs/apk/debug/app-debug.apk "liveinfe.apk"

      - name: Disponibilizar APK para Download (Artefato)
        uses: actions/upload-artifact@v4
        with:
          name: LiveinFe-Android-APK
          path: liveinfe*.apk
          retention-days: 30

  release:
    name: Publicar Release Oficial no GitHub
    needs: build-android
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Baixar APK compilado
        uses: actions/download-artifact@v4
        with:
          name: LiveinFe-Android-APK
          path: release-assets/

      - name: Criar Release e Anexar APK
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/liveinfe*.apk
          name: "LiveinFé ${{ github.ref_name }}"
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
